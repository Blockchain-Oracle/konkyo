server {
  listen 80;
  root /usr/share/nginx/html;
  charset utf-8;
  # Behind the proxy: redirects keep the reader's scheme and host.
  absolute_redirect off;

  # Static export: /docs/guide/ask is docs/guide/ask.html.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;

  # The docs start at the guide.
  location = /docs { return 301 /docs/guide; }

  # Addresses the docs had before they moved under /docs (the README and submission link some).
  location = /architecture { return 301 /docs/build; }
  location = /how-answers-are-checked { return 301 /docs/agents/how-answers-are-checked; }
  location = /agents-and-traces { return 301 /docs/agents; }
  location = /sponsor-tech { return 301 /docs/partners; }
  location = /spaces-and-sharing { return 301 /docs/guide/spaces; }
  location = /cli-and-api { return 301 /docs/build/cli-and-api; }
  location = /sample-mode { return 301 /docs/build/sample-mode; }
  location = /self-hosting { return 301 /docs/build/self-hosting; }
  location = /limits { return 301 /docs/build/limits; }

  # Pages as Markdown (Copy Markdown, Open in ChatGPT or Claude) open as text.
  location ~ \.md$ {
    default_type text/markdown;
  }

  # The link preview is exported without an extension; say what it is.
  location = /opengraph-image {
    default_type image/png;
    add_header Cache-Control "public, max-age=3600";
  }
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~ ^/(shots|diagrams|logos)/ {
    add_header Cache-Control "public, max-age=86400";
  }
}
